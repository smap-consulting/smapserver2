<IfModule mod_ssl.c>

ServerAdmin webmaster@localhost

ErrorLog {apache_log_dir}/error.log

LogLevel warn
CustomLog {apache_log_dir}/ssl_access.log combined

SSLCertificateFile    {ssl_cert_file}
SSLCertificateKeyFile {ssl_key_file}

SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
SSLHonorCipherOrder on
SSLCipherSuite "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+aRSA+RC4 EECDH EDH+aRSA RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS"

FileETag None
ExpiresActive On
ExpiresDefault A3600
SetOutputFilter DEFLATE

<FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
</FilesMatch>
<Directory /usr/lib/cgi-bin>
        SSLOptions +StdEnvVars
</Directory>

BrowserMatch "MSIE [2-6]" \
        nokeepalive ssl-unclean-shutdown \
        downgrade-1.0 force-response-1.0
# MSIE 7 and newer should be able to use keepalive
BrowserMatch "MSIE [17-9]" ssl-unclean-shutdown

<VirtualHost *:443>
        ServerAdmin webmaster@localhost
        ServerName {hostname}
        ServerAlias {hostname}
        DocumentRoot /var/www/smap
        SSLEngine on
        DBDriver pgsql
        DBDParams "host=${DBHOST} dbname=survey_definitions user=ws password=ws1234"
        DirectoryIndex index.html index.htm index.shtml

        # setDomain.sh, run by install.sh, replaces the ServerName and the Host check in this virtual host
        # with the domain name, or the IP address if there is none.  Run it again to change it.
        <If "req('Host') != '{hostname}'">
           Require all denied
        </If>

        Include {apache_site_dir}/smap-volatile.conf

        ErrorLog {apache_log_dir}/error.log

        # Possible values include: debug, info, notice, warn, error, crit,
        # alert, emerg.
        LogLevel warn

        CustomLog {apache_log_dir}/access.log combined

</VirtualHost>

</IfModule>
