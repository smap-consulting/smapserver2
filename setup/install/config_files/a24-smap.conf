FileETag None
ExpiresActive On
ExpiresDefault A3600

# Port 80 virtual host.
#
# This file holds only the settings that are specific to this virtual host.  Every
# ProxyPass, Location and Directory rule lives in smap-volatile.conf, which is included
# below and is also included by smap-ssl.conf.
#
# It used to carry its own inline copy of all of those rules.  The copy drifted - it was
# missing /token, /sms and /mcp, and still had rules for paths that no longer exist -
# because install.sh copies this file only at first install, while apacheConfig.sh
# refreshes smap-volatile.conf on every upgrade.  One authoritative file means the two
# virtual hosts cannot disagree about who is allowed to reach what.
#
# Note that credentials sent to this virtual host are not encrypted.  Serving the
# application on port 80 at all is a deployment decision; it is unchanged here.

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/smap
    ServerName {hostname}
    ServerAlias {hostname}
    DBDriver pgsql
    DBDParams "host=${DBHOST} dbname=survey_definitions user=ws password=ws1234"
    DirectoryIndex index.html index.htm index.shtml

    # setDomain.sh, run by install.sh, replaces the ServerName and the Host check in this virtual host
    # with the domain name, or removes them if the server has none.  Run it again to change the domain.
    #
    # The application builds links in emails from the host name a request arrives with, so
    # this check is what stops a forged Host header putting another site in those links.
    <If "req('Host') != '{hostname}'">
       Deny from all
    </If>

    Include sites-available/smap-volatile.conf

    ErrorLog ${APACHE_LOG_DIR}/error.log

    # Possible values include: debug, info, notice, warn, error, crit,
    # alert, emerg.
    LogLevel warn

    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
