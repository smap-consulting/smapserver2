#
# Apache configuration for a Smap server running on a Mac for development.
#
# This is for the Homebrew Apache, not the one in /usr/sbin.  Apple's httpd links the
# apr-util inside the dyld shared cache, which is built without DSO driver loading and
# with only the sqlite3 DBD driver compiled in, so mod_dbd on it can never reach Postgres
# - DBDriver pgsql fails with "No driver for pgsql" and there is nowhere to install a
# driver to fix it.  The Homebrew apr-util does load drivers from a directory, which is
# what build-apr-dbd-pgsql.sh in this directory puts one in.
#
# Install with install.sh in this directory, which copies this file to
# /opt/homebrew/etc/httpd/httpd.conf.  The Homebrew prefix is written out in full here so
# that the file can be read and syntax checked as it stands; install.sh rewrites it to
# wherever brew actually is, which is /usr/local on an Intel Mac.
#
# Listens on 80 rather than the Homebrew default of 8080, because the console and the
# mobile clients are configured with bare host names, so:
#     sudo brew services start httpd
#
ServerRoot "/opt/homebrew/opt/httpd"
Listen 80
ServerName localhost
User _www
Group _www
ServerAdmin webmaster@localhost

#
# Only the modules the Smap configuration actually uses.
#
# dbd and authn_dbd are the point of this file: every Location in smap-volatile
# authenticates against the users table in survey_definitions rather than against a
# password file.
#
LoadModule mpm_event_module lib/httpd/modules/mod_mpm_event.so
LoadModule unixd_module lib/httpd/modules/mod_unixd.so
LoadModule log_config_module lib/httpd/modules/mod_log_config.so
LoadModule env_module lib/httpd/modules/mod_env.so
LoadModule setenvif_module lib/httpd/modules/mod_setenvif.so
LoadModule reqtimeout_module lib/httpd/modules/mod_reqtimeout.so
LoadModule filter_module lib/httpd/modules/mod_filter.so
LoadModule deflate_module lib/httpd/modules/mod_deflate.so
LoadModule mime_module lib/httpd/modules/mod_mime.so
LoadModule include_module lib/httpd/modules/mod_include.so
LoadModule negotiation_module lib/httpd/modules/mod_negotiation.so
LoadModule dir_module lib/httpd/modules/mod_dir.so
LoadModule alias_module lib/httpd/modules/mod_alias.so
LoadModule headers_module lib/httpd/modules/mod_headers.so
LoadModule expires_module lib/httpd/modules/mod_expires.so

LoadModule authn_core_module lib/httpd/modules/mod_authn_core.so
LoadModule authz_core_module lib/httpd/modules/mod_authz_core.so
LoadModule authz_host_module lib/httpd/modules/mod_authz_host.so
LoadModule authz_user_module lib/httpd/modules/mod_authz_user.so
LoadModule auth_basic_module lib/httpd/modules/mod_auth_basic.so
LoadModule auth_form_module lib/httpd/modules/mod_auth_form.so
LoadModule request_module lib/httpd/modules/mod_request.so
LoadModule dbd_module lib/httpd/modules/mod_dbd.so
LoadModule authn_dbd_module lib/httpd/modules/mod_authn_dbd.so

LoadModule session_module lib/httpd/modules/mod_session.so
LoadModule session_cookie_module lib/httpd/modules/mod_session_cookie.so
LoadModule session_crypto_module lib/httpd/modules/mod_session_crypto.so

LoadModule proxy_module lib/httpd/modules/mod_proxy.so
LoadModule proxy_ajp_module lib/httpd/modules/mod_proxy_ajp.so

#
# The session cookie is encrypted, and smap-volatile names the passphrase but does not
# set it - on a server it comes from /etc/environment through apache's envvars, which
# Homebrew's Apache does not have.  Put a line of the form
#
#     Define SESSPASS <passphrase>
#
# in /opt/homebrew/etc/httpd/smap-local.conf to override the development default below,
# along with anything else local to this machine.  That file is not in the repository.
#
IncludeOptional /opt/homebrew/etc/httpd/smap-local.conf
<IfDefine !SESSPASS>
    Define SESSPASS development-only-session-passphrase
</IfDefine>
SessionCryptoDriver openssl

<IfModule mpm_event_module>
    StartServers             2
    MinSpareThreads         25
    MaxSpareThreads         75
    ThreadsPerChild         25
    MaxRequestWorkers      150
    MaxConnectionsPerChild   0
</IfModule>

TypesConfig /opt/homebrew/etc/httpd/mime.types
ErrorLog /opt/homebrew/var/log/httpd/error_log
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /opt/homebrew/var/log/httpd/access_log combined
LogLevel warn

FileETag None
ExpiresActive On
ExpiresDefault A3600

<VirtualHost *:80>
    ServerName localhost
    ServerAlias localhost
    DocumentRoot /Library/WebServer/Documents
    DirectoryIndex index.html index.htm index.shtml

    # The Postgres connection pool that every AuthDBDUserPWQuery and AuthDBDUserRealmQuery
    # in smap-volatile runs against.  Same credentials as the server install.
    DBDriver pgsql
    DBDParams "host=localhost dbname=survey_definitions user=ws password=ws1234"

    # Every ProxyPass, Location and Directory rule, shared with the production servers.
    # Deployed as a symlink to setup/install/config_files/a24-smap-volatile.conf in the
    # repository, so a pull is enough to pick up a change - see install.sh.
    Include /private/etc/apache2/other/smap-volatile

    # smap-volatile denies <Directory /> outright and grants /var/www/smap, which is where
    # a Linux install puts the console.  On a Mac it is under the Apple document root, so
    # that has to be granted here.  Directory sections are merged shortest path first, so
    # this wins over the deny whichever file it is written in.
    <Directory /Library/WebServer/Documents>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Location /smapConsulting>
        AddType text/html .shtml
        AddOutputFilter INCLUDES .shtml
        Options -Indexes +FollowSymLinks +MultiViews +Includes
        Require all granted
    </Location>
</VirtualHost>
